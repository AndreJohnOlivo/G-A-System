<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unida Christian Colleges Enrollment</title>
  <link rel="icon" type="image/png" href="ucc.png">
  <style>
    body {
      background: url(college2.JPG) no-repeat center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      height: 100vh;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: #ffffff;
      overflow: scroll;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      padding: 30px;
      display: flex;
      flex-direction: column;
      opacity: 0.9;
    }
    input, select {
      font-family: Arial, sans-serif;
      width: 100%;
      padding: 10px;
      border: 1px solid dodgerblue;
      border-radius: 5px;
      font-size: 16px;
      background-color: #fafafa;
    }
    input:focus, select:focus {
      outline: none;
      border-color: dodgerblue;
      box-shadow: 0 0 5px rgba(30, 144, 255, 0.5);
    }
    img {
      display: block;
      margin: 0 auto 20px;
    }
    h1, h2 {
      text-align: center;
    }
    h1 {
      color: rgb(0, 102, 0);
    }
    h2 {
      color: rgb(204, 151, 16);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-family: Arial, sans-serif;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px 15px;
      background-color: dodgerblue;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
      margin-top: 10px;
    }
    .button:disabled {
      background-color: gray;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <form id="enrollment-form">
      <img src="UNIDA CHRISTIAN COLLEGES.png" alt="UCC">
      <h1>COLLEGE ENROLLMENT</h1>
      <h2>Bold. Emerging. Resolute.</h2>

      <div class="form-group">
        <label for="firstname">First Name</label>
        <input type="text" id="firstname" placeholder="First Name" required>
      </div>
      <div class="form-group">
        <label for="middlename">Middle Name</label>
        <input type="text" id="middlename" placeholder="Middle Name">
      </div>
      <div class="form-group">
        <label for="surname">Surname</label>
        <input type="text" id="surname" placeholder="Surname" required>
      </div>
      <div class="form-group">
        <label for="suffix">Suffix (Optional)</label>
        <input type="text" id="suffix" placeholder="Suffix">
      </div>
      <div class="form-group">
        <label for="dateofbirth">Date of Birth</label>
        <input type="date" id="dateofbirth" required>
      </div>
      <div class="form-group">
        <label for="phonenumber">Phone</label>
        <input type="tel" id="phonenumber" placeholder="Phone Number" required maxlength="11">
        <small id="phone-error" style="color: red; display: none;">Phone number must start with "09" and have exactly 11 digits.</small>
      </div>
      <div class="form-group">
        <label for="homeaddress">Home Address</label>
        <input type="text" id="homeaddress" placeholder="Home Address" required>
      </div>
      <div class="form-group">
        <label for="sexatbirth">Sex at Birth</label>
        <select id="sexatbirth" required>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>
      <div class="form-group">
        <label for="civilstatus">Civil Status</label>
        <select id="civilstatus" required>
          <option value="single">Single</option>
          <option value="married">Married</option>
        </select>
      </div>
      <div class="form-group">
        <label for="studenttype">Student Type</label>
        <select id="studenttype" required>
          <option value="">Choose Student Type</option>
          <option value="New Student">New Student</option>
          <option value="Transferee">Transferee</option>
          <option value="Old Student">Old Student</option>
        </select>
      </div>
      <button type="button" id="next-button" class="button">Next</button>
    </form>
  </div>

  <script>
    // Reference necessary elements
    const nextButton = document.getElementById('next-button');

    nextButton.addEventListener('click', (event) => {
      event.preventDefault(); // Prevent default form submission

      const formData = {
        firstname: document.getElementById('firstname').value,
        middlename: document.getElementById('middlename').value || null,
        surname: document.getElementById('surname').value,
        suffix: document.getElementById('suffix').value || null,
        dateofbirth: document.getElementById('dateofbirth').value,
        phonenumber: document.getElementById('phonenumber').value,
        homeaddress: document.getElementById('homeaddress').value,
        sexatbirth: document.getElementById('sexatbirth').value,
        civilstatus: document.getElementById('civilstatus').value,
        studenttype: document.getElementById('studenttype').value
      };

      console.log('Form data:', formData);

      // Save enrollment data to the backend
      fetch('/api/students', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(formData)
      })
      .then(response => {
        if (!response.ok) {
          return response.json().then(data => {
            throw new Error(data.error || 'Unknown error occurred');
          });
        }
        return response.json();
      })
      .then(data => {
        alert('Enrollment saved successfully!');
        // Redirect based on selected student type - bypass requirements for Old Students
        if (formData.studenttype === 'Transferee') {
          alert('Please visit the College Department for Assessment and Crediting of Subjects.');
        } else if (formData.studenttype === 'New Student') {
          window.location.href = 'requirements.html';
        } else if (formData.studenttype === 'Old Student') {
          window.location.href = 'courses.html';
        }
      })
      .catch(error => {
        console.error('Error submitting enrollment:', error.message);
        alert(`Error saving enrollment: ${error.message}`);
      });
    });
  </script>
</body>
</html>
