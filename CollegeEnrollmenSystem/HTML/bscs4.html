<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unida Christian Colleges Enrollment</title>
  <link rel="icon" type="image/png" href="ucc.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    img {
      height: 80px;
      align-self: center;
      flex-direction: column;
      opacity: 0.9;
    }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      height: 200vh;
      background: url(college2.JPG) no-repeat center fixed;
      background-size: cover;
    }
    p {
      text-align: center;
      color: rgb(255, 255, 255);
    }
    table {
      font-family: Arial, sans-serif;
      background-color: white;
      border-collapse: collapse;
      width: 80%;
      margin: 40px;
      opacity: 0.9;
    }
    td, th {
      border: 1px solid #dddddd;
      text-align: left;
      padding: 8px;
    }
    tr:nth-child(even) {
      background-color: #dddddd;
    }
    h2, h3 {
      text-align: center;
      color: rgb(0, 0, 0);
    }
    button {
      border: 1px;
      width: 100px;
      height: fit-content;
      background: goldenrod;
      border-radius: 10px;
      padding: 10px;
      color: white;
      cursor: pointer;
    }
    #submit-popover {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      z-index: 1000;
    }
    #submit-popover h4 {
      margin-bottom: 20px;
    }
    #submit-popover button {
      margin: 0 10px;
    }
    #overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
    }
  </style>
</head>
<body>
  <img src="UNIDA CHRISTIAN COLLEGES.png" alt="UCC">
  <h2>COLLEGE DEPARTMENT</h2>
  <h2>Curriculum Guide</h2>
  <h2>Bachelor of Science in Computer Science</h2>
  <p>Effective AY 2024-2025</p>

  <table>
    <caption><h2>FOURTH YEAR</h2><h3>1st Semester</h3></caption>
    <tr>
      <th>Course Code</th>
      <th>Course Title</th>
      <th>Units</th>
      <th>Take</th>
    </tr>
    <tr>
      <td>CS OS 101</td>
      <td>Operating System</td>
      <td>3</td>
      <td><input type="checkbox"></td>
    </tr>
    <tr>
      <td>BSCS THS 103</td>
      <td>Thesis Writing 2</td>
      <td>3</td>
      <td><input type="checkbox"></td>
    </tr>
    <tr>
      <td>GEd SocSci 101</td>
      <td>Understanding Self</td>
      <td>3</td>
      <td><input type="checkbox"></td>
    </tr>
    <tr>
      <td><b>TOTAL</b></td>
      <td></td>
      <td></td>
      <td><b>9</b></td>
    </tr>
  </table>

  <button id="submit-button">Submit</button>

  <div id="overlay"></div>
  <div id="submit-popover">
    <h4>Are you sure?</h4>
    <button id="confirm-button">Yes</button>
    <button id="cancel-button">No</button>
  </div>

  <script>
    // Event listener for the submit button
    document.getElementById('submit-button').addEventListener('click', function () {
      // Select all checkboxes within the table
      var subjects = document.querySelectorAll('table input[type="checkbox"]');
      var atLeastOneSelected = false;
      
      // Check each checkbox
      for (var i = 0; i < subjects.length; i++) {
        if (subjects[i].checked) {
          atLeastOneSelected = true;
          break;
        }
      }
      
      // If none selected, alert and do not proceed
      if (!atLeastOneSelected) {
        alert("Please select at least one subject before proceeding.");
      } else {
        // If at least one is selected, show the confirmation popover
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('submit-popover').style.display = 'block';
      }
    });

    // Close the popover when "No" is clicked
    document.getElementById('cancel-button').addEventListener('click', function () {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('submit-popover').style.display = 'none';
    });

    // Redirect to the confirmation page when "Yes" is clicked
    document.getElementById('confirm-button').addEventListener('click', function () {
      window.location.href = 'enrollment_confirmation.html';
    });
  </script>
</body>
</html>
