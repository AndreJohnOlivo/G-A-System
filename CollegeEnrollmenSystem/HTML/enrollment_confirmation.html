<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enrollment Confirmation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Background Transition Animation */
    @keyframes bgTransition {
      0% {
        background: url(college1.JPG) no-repeat center fixed;
        background-size: cover;
      }
      50% {
        background: url(college2.JPG) no-repeat center fixed; /* Alternative background image */
        background-size: cover;
      }
      100% {
        background: url(college3.JPG) no-repeat center fixed;
        background-size: cover;
      }
    }
    
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center;
      min-height: 100vh;
      /* Apply the background transition animation */
      animation: bgTransition 15s infinite;
    }
    
    .confirmation-container {
      background: #fff;
      padding: 40px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      text-align: center;
      max-width: 400px;
    }
    
    .confirmation-container h1 {
      color: #28a745;
      margin-bottom: 20px;
    }
    
    .confirmation-container p {
      color: #333;
      font-size: 18px;
      margin-bottom: 30px;
    }
    
    .confirmation-container .next-btn {
      display: inline-block;
      background: #007bff;
      color: #fff;
      padding: 10px 24px;
      border-radius: 5px;
      text-decoration: none;
      font-size: 16px;
      transition: background 5s;
    }
    
    .confirmation-container .next-btn:hover {
      background: #0056b3;
    }
    
    .checkmark {
      font-size: 48px;
      color: #28a745;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="confirmation-container">
    <div class="checkmark">&#10004;</div>
    <h1>Enrollment Confirmed!</h1>
    <p>
      Congratulations! You are now officially enrolled.<br>
      Further instructions and updates will be sent to your email.
    </p>
    <a href="index.html" class="next-btn">Return to Home</a>
  </div>
</body>
</html>
