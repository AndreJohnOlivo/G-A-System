services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: BACKEND/Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/ucc_backend_db
      MONGO_DB_NAME: UCC_G&A_DB
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment or .env file}
      PROGRAM_HEAD_PASSWORD: ${PROGRAM_HEAD_PASSWORD:?Set PROGRAM_HEAD_PASSWORD in your environment or .env file}
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "3000"

  load-balancer:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mongo_data: