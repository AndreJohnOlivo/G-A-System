<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Sign-In</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <p class="eyebrow">Student Access</p>
        <h1>Student Sign-In &amp; Registration</h1>
        <p class="auth-intro">Use this page to sign in or register as a student. Once you are done, you will be sent back to the main portal.</p>

        <form id="student-login-form" class="auth-form">
          <label class="auth-field">
            <span>Username or Email</span>
            <input id="student-login-username" type="text" placeholder="Enter your username or email" required />
          </label>
          <label class="auth-field">
            <span>Password</span>
            <input id="student-login-password" type="password" placeholder="Enter your password" required />
          </label>
          <button type="submit" class="btn btn-primary auth-submit">Sign In</button>
          <p id="student-login-message" class="auth-message" role="status"></p>
        </form>

        <div id="registration-panel" class="registration-panel">
          <h3>New student? Register here</h3>
          <p>Complete your profile so your record can be recognized by the system.</p>
          <form id="student-registration-form" class="auth-form compact-form">
            <label class="auth-field">
              <span>Full Name</span>
              <input id="student-name" type="text" placeholder="Enter your full name" required />
            </label>
            <label class="auth-field">
              <span>Student ID</span>
              <input id="student-id" type="text" placeholder="Enter your student ID" required />
            </label>
            <label class="auth-field">
              <span>Email</span>
              <input id="student-email" type="email" placeholder="Enter your email" required />
            </label>
            <label class="auth-field">
              <span>Create Password</span>
              <input id="student-password" type="password" placeholder="Create a password" required />
            </label>
            <button type="submit" class="btn btn-secondary auth-submit">Register</button>
            <p id="student-registration-message" class="auth-message"></p>
          </form>
        </div>

        <a id="return-to-main" href="index.html" class="auth-link">Return to main portal</a>
      </div>
    </div>

    <script>
      const storageKey = 'uccStudentRecords';
      const loginForm = document.getElementById('student-login-form');
      const registrationForm = document.getElementById('student-registration-form');
      const registrationPanel = document.getElementById('registration-panel');
      const loginMessage = document.getElementById('student-login-message');
      const registrationMessage = document.getElementById('student-registration-message');

      function normalizeIdentifier(value) {
        return value.trim().toLowerCase();
      }

      async function hashValue(value) {
        const encoder = new TextEncoder();
        const data = encoder.encode(value);
        const digest = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(digest))
          .map((byte) => byte.toString(16).padStart(2, '0'))
          .join('');
      }

      async function hashPassword(password, salt) {
        return hashValue(`${salt}:${password}`);
      }

      function getPagePath(fileName) {
        const currentPath = window.location.pathname;
        const directory = currentPath.includes('/') ? currentPath.substring(0, currentPath.lastIndexOf('/') + 1) : './';
        return `${directory}${fileName}`;
      }

      function loadRegisteredStudents() {
        try {
          const saved = localStorage.getItem(storageKey);
          return saved ? JSON.parse(saved) : [];
        } catch (error) {
          return [];
        }
      }

      function saveRegisteredStudents(students) {
        localStorage.setItem(storageKey, JSON.stringify(students));
      }

      const registeredStudents = loadRegisteredStudents();

      function returnToMainPortal(message) {
        const targetPath = getPagePath('index.html');
        const url = new URL(targetPath, window.location.href);
        if (message) {
          url.searchParams.set('message', message);
        }
        window.location.replace(url.toString());
      }

      document.getElementById('return-to-main').addEventListener('click', (event) => {
        event.preventDefault();
        returnToMainPortal('Returned to the main portal.');
      });

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const username = normalizeIdentifier(document.getElementById('student-login-username').value);
        const password = document.getElementById('student-login-password').value;

        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role: 'student', username, password })
          });
          const result = await response.json();
          if (!response.ok || !result.success) {
            loginMessage.textContent = result.message || 'Invalid student credentials.';
            return;
          }

          sessionStorage.setItem('uccAccessRole', result.role);
          sessionStorage.setItem('uccAccessToken', result.token);
          sessionStorage.setItem('currentStudentName', result.student?.name || 'Student');
          returnToMainPortal('Student sign-in completed.');
        } catch (error) {
          console.error('Student login error:', error);
          loginMessage.textContent = 'Unable to connect to the server.';
        }
      });

      registrationForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const fullName = document.getElementById('student-name').value.trim();
        const studentId = document.getElementById('student-id').value.trim();
        const email = document.getElementById('student-email').value.trim();
        const studentPassword = document.getElementById('student-password').value;

        if (!fullName || !studentId || !email || !studentPassword) {
          registrationMessage.textContent = 'Please complete every registration field.';
          return;
        }

        try {
          const response = await fetch('/api/student-registration', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: fullName, studentId, email, password: studentPassword })
          });
          const result = await response.json();
          if (!response.ok || !result.success) {
            registrationMessage.textContent = result.message || 'Registration could not be completed.';
            return;
          }

          registrationForm.reset();
          registrationPanel.classList.add('hidden');
          loginMessage.textContent = 'Registration successful. Sign in with your email and password.';
          registrationMessage.textContent = '';
          document.getElementById('student-login-username').focus();
        } catch (error) {
          console.error('Student registration error:', error);
          registrationMessage.textContent = 'Unable to connect to the server.';
        }
      });
    </script>
  </body>
</html>
